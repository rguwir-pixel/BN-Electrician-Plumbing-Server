<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BN Electrician & Plumbing</title>
<style>
body{margin:0;background:#f2f5f7;font-family:Arial;color:#17202a;padding-bottom:70px}
header{background:#075e54;color:white;padding:16px;position:sticky;top:0}
main{max-width:600px;margin:auto;padding:14px}.card{background:white;padding:15px;border-radius:14px;margin:10px 0;box-shadow:0 2px 8px #0001}
input,textarea,select,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;box-sizing:border-box}
input,textarea,select{border:1px solid #ddd}button{border:0;background:#075e54;color:white;font-weight:bold}
button.green{background:#25d366}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{height:90px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;gap:4px;padding:8px;box-shadow:0 -2px 8px #0002}nav button{margin:0;font-size:12px}
.hidden{display:none}.muted{color:#666;font-size:13px}
img{max-width:100%;border-radius:10px}
</style>
</head>
<body>
<header><b>⚡ BN Electrician & Plumbing 🔧</b><div class="muted" style="color:#ddd">Online Community & Work</div></header>
<main>

<div id="login" class="card">
<h2>📱 Login</h2>
<input id="email" placeholder="Email">
<input id="name" placeholder="नाम">
<select id="role"><option value="CUSTOMER">कस्टमर</option><option value="ELECTRICIAN">इलेक्ट्रीशियन</option><option value="PLUMBER">प्लंबर</option></select>
<button onclick="login()">Login</button>
<p class="muted">Owner: rguwir@gmail.com</p>
</div>

<div id="app" class="hidden">
<div id="home" class="card">
<h2>नमस्ते 👋</h2><p id="who"></p>
<div class="grid">
<button onclick="page('jobs')">🛠️ काम देखें</button>
<button onclick="page('createJob')">➕ काम डालें</button>
<button onclick="page('posts')">📸 पोस्ट</button>
<button onclick="page('profile')">👤 प्रोफाइल</button>
<button onclick="page('location')">📍 लाइव लोकेशन</button>
<button onclick="page('subscription')">💳 सदस्यता</button>
</div>
</div>

<div id="jobs" class="card hidden"><h2>🛠️ काम</h2><div id="jobList"></div></div>

<div id="createJob" class="card hidden"><h2>काम डालें</h2>
<select id="jtype"><option>इलेक्ट्रिशियन</option><option>प्लंबर</option></select>
<input id="jtitle" placeholder="काम का नाम"><textarea id="jdesc" placeholder="विवरण"></textarea>
<input id="jprice" placeholder="कीमत ₹"><input id="jphone" placeholder="मोबाइल नंबर">
<button onclick="jobLocation()">📍 लोकेशन लें</button><p id="jl" class="muted"></p>
<button onclick="createJob()">काम पोस्ट करें</button></div>

<div id="posts" class="card hidden"><h2>📸 पोस्ट</h2><textarea id="ptext" placeholder="कुछ लिखें..."></textarea>
<input id="pimage" type="file" accept="image/*"><button onclick="createPost()">पोस्ट करें</button><div id="postList"></div></div>

<div id="profile" class="card hidden"><h2>👤 प्रोफाइल</h2>
<input id="pname" placeholder="नाम"><input id="city" placeholder="शहर"><input id="exp" placeholder="अनुभव">
<button onclick="saveProfile()">सेव</button><p id="profileInfo"></p></div>

<div id="location" class="card hidden"><h2>📍 लोकेशन</h2>
<button onclick="currentLocation()">करंट लोकेशन</button><button onclick="liveLocation()">🔴 लाइव लोकेशन शुरू</button><button onclick="stopLive()">बंद करें</button><p id="loc"></p></div>

<div id="subscription" class="card hidden"><h2>💳 Worker Membership</h2>
<button onclick="subscribe(50)">₹50 / महीना</button><button onclick="subscribe(100)">₹100 / महीना</button><p id="submsg" class="muted"></p></div>

<div id="admin" class="card hidden"><h2>👑 Owner Panel</h2><button onclick="admin()">Dashboard</button><pre id="adminData" style="white-space:pre-wrap"></pre></div>
</div>
</main>

<nav id="nav" class="hidden"><button onclick="page('home')">🏠 Home</button><button onclick="page('jobs')">🛠️ Work</button><button onclick="page('posts')">📸 Post</button><button onclick="page('profile')">👤 Profile</button><button id="adminBtn" class="hidden" onclick="page('admin')">👑 Owner</button></nav>

<script>
const API = "https://bn-electrician-plumbing-server-1.onrender.com/api"; 
let token=localStorage.getItem("bn_token")||"", me=null, watch=null;

async function api(path,opt={}){
  try {
    opt.headers={...(opt.headers||{}),"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})};
    let r=await fetch(API+path,opt);
    let d=await r.json();
    if(!r.ok) throw Error(d.error || "सर्वर ने एरर दी है: " + r.status);
    return d;
  } catch (err) {
    alert("API Error (" + path + "): " + err.message);
    throw err;
  }
}

async function login(){
  try{
    let emailVal = document.getElementById("email").value;
    let nameVal = document.getElementById("name").value;
    let roleVal = document.getElementById("role").value;

    if(!emailVal || !nameVal) {
      alert("कृपया ईमेल और नाम दोनों भरें!");
      return;
    }

    let d = await api("/login", {
      method: "POST",
      body: JSON.stringify({email: emailVal, name: nameVal, role: roleVal})
    });
    
    token = d.token;
    me = d.user;
    localStorage.setItem("bn_token", token);
    alert("लॉगिन सफल हो गया!");
    openApp();
  }catch(e){
    alert("लॉगिन फेल हुआ: " + e.message);
  }
}

function openApp(){
  loginBox(false);
  document.getElementById("who").textContent = me.name + " • " + me.role;
  document.getElementById("adminBtn").classList.toggle("hidden", me.role !== "OWNER");
  page("home");
  loadJobs();
  loadPosts();
  loadProfile();
}

function loginBox(hide){
  document.getElementById("login").classList.toggle("hidden", hide);
  document.getElementById("app").classList.toggle("hidden", !hide);
  document.getElementById("nav").classList.toggle("hidden", !hide);
}

function page(id){
  document.querySelectorAll("#app>div").forEach(x=>x.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  if(id==="jobs") loadJobs();
  if(id==="posts") loadPosts();
  if(id==="admin") admin();
}

async function loadJobs(){
  try{
    let a = await api("/jobs");
    document.getElementById("jobList").innerHTML = a.map(j=>`<div class="card"><b>${j.title}</b><p>${j.type} • ${j.description}</p><b>₹${j.price||"बात करके"}</b><p class="muted">${j.ownerName}</p><button onclick="take('${j.id}')">🛠️ काम लेना है</button><button class="green" onclick="location.href='tel:${j.phone}'">📞 कॉल</button><button class="green" onclick="window.open('https://wa.me/91'+String('${j.phone}').replace(/\\D/g,''),'_blank')">🟢 WhatsApp</button>${j.location?`<a target="_blank" href="https://www.google.com/maps?q=${j.location.lat},${j.location.lng}">📍 रास्ता देखें</a>`:""}</div>`).join("");
  }catch(e){}
}

async function take(id){
  try{
    await api("/jobs/"+id+"/take",{method:"POST"});
    alert("काम लेने की रिक्वेस्ट भेजी गई");
    loadJobs();
  }catch(e){}
}

function jobLocation(){
  navigator.geolocation.getCurrentPosition(p=>{
    window.jloc={lat:p.coords.latitude,lng:p.coords.longitude};
    document.getElementById("jl").textContent=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;
  },()=>alert("लोकेशन अनुमति दें"));
}

async function createJob(){
  try{
    let t = document.getElementById("jtype").value;
    let ti = document.getElementById("jtitle").value;
    let d = document.getElementById("jdesc").value;
    let pr = document.getElementById("jprice").value;
    let ph = document.getElementById("jphone").value;
    
    await api("/jobs",{method:"POST",body:JSON.stringify({type:t,title:ti,description:d,price:pr,phone:ph,location:window.jloc||null})});
    alert("काम पोस्ट हो गया");
    page("jobs");
    loadJobs();
  }catch(e){}
}

function fileData(file){
  return new Promise((res,rej)=>{
    let r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

async function createPost(){
  try{
    let pt = document.getElementById("ptext").value;
    let pi = document.getElementById("pimage").files[0];
    let img = pi ? await fileData(pi) : "";
    await api("/posts",{method:"POST",body:JSON.stringify({text:pt,image:img})});
    document.getElementById("ptext").value="";
    document.getElementById("pimage").value="";
    loadPosts();
  }catch(e){}
}

async function loadPosts(){
  try{
    let a = await api("/posts");
    document.getElementById("postList").innerHTML = a.map(p=>`<div class="card"><b>${p.userName}</b><p>${p.text}</p>${p.image?`<img src="${p.image}">`:""}</div>`).join("");
  }catch(e){}
}

async function loadProfile(){
  try{
    let u = await api("/me");
    me = u;
    document.getElementById("pname").value = u.name||"";
    document.getElementById("city").value = u.city||"";
    document.getElementById("exp").value = u.experience||"";
    document.getElementById("profileInfo").textContent = `${u.email} • ${u.role}`;
  }catch(e){}
}

async function saveProfile(){
  try{
    let n = document.getElementById("pname").value;
    let c = document.getElementById("city").value;
    let e = document.getElementById("exp").value;
    await api("/profile",{method:"PUT",body:JSON.stringify({name:n,city:c,experience:e})});
    alert("सेव हो गया");
    loadProfile();
    document.getElementById("who").textContent = n + " • " + me.role;
  }catch(err){}
}

function currentLocation(){
  navigator.geolocation.getCurrentPosition(p=>{
    document.getElementById("loc").textContent=`📍 ${p.coords.latitude}, ${p.coords.longitude}`;
    window.lastLoc={lat:p.coords.latitude,lng:p.coords.longitude};
  },()=>alert("लोकेशन अनुमति दें"));
}

function liveLocation(){
  if(watch)return;
  watch=navigator.geolocation.watchPosition(p=>{
    document.getElementById("loc").textContent=`🔴 LIVE: ${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;
  },()=>alert("लाइव लोकेशन अनुमति दें"));
}

function stopLive(){
  if(watch!==null)navigator.geolocation.clearWatch(watch);
  watch=null;
  document.getElementById("loc").textContent="लाइव लोकेशन बंद है";
}

async function subscribe(plan){
  try{
    let d=await api("/subscriptions",{method:"POST",body:JSON.stringify({plan})});
    document.getElementById("submsg").textContent=d.message;
  }catch(e){alert(e.message);}
}

async function admin(){
  try{
    let d=await api("/admin/dashboard");
    document.getElementById("adminData").textContent=JSON.stringify({owner:d.owner,users:d.users,jobs:d.jobs,posts:d.posts,subscriptions:d.subscriptions},null,2);
  }catch(e){
    document.getElementById("adminData").textContent=e.message;
  }
}

if(token){
  api("/me").then(u=>{me=u;openApp()}).catch(()=>{token="";localStorage.removeItem("bn_token")});
}
</script>
</body>
</html>
