<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BN Electrician & Plumbing</title>
<style>
body{margin:0;background:#f2f5f7;font-family:Arial;color:#17202a;padding-bottom:70px}
header{background:#075e54;color:white;padding:16px;position:sticky;top:0}
main{max-width:600px;margin:auto;padding:14px}.card{background:white;padding:15px;border-radius:14px;margin:10px 0;box-shadow:0 2px 8px #0001}
input,textarea,select,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;box-sizing:border-box}
input,textarea,select{border:1px solid #ddd}button{border:0;background:#075e54;color:white;font-weight:bold}
button.green{background:#25d366}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{height:90px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;gap:4px;padding:8px;box-shadow:0 -2px 8px #0002}nav button{margin:0;font-size:12px}
.hidden{display:none}.muted{color:#666;font-size:13px}
img{max-width:100%;border-radius:10px}
</style>
</head>
<body>
<header><b>⚡ BN Electrician & Plumbing 🔧</b><div class="muted" style="color:#ddd">Online Community & Work</div></header>
<main>

<div id="login" class="card">
<h2>📱 Login</h2>
<input id="email" placeholder="Email">
<input id="name" placeholder="नाम">
<select id="role"><option value="CUSTOMER">कस्टमर</option><option value="ELECTRICIAN">इलेक्ट्रीशियन</option><option value="PLUMBER">प्लंबर</option></select>
<button onclick="login()">Login</button>
<p class="muted">Owner: rguwir@gmail.com</p>
</div>

<div id="app" class="hidden">
<div id="home" class="card">
<h2>नमस्ते 👋</h2><p id="who"></p>
<div class="grid">
<button onclick="page('jobs')">🛠️ काम देखें</button>
<button onclick="page('createJob')">➕ काम डालें</button>
<button onclick="page('posts')">📸 पोस्ट</button>
<button onclick="page('profile')">👤 प्रोफाइल</button>
<button onclick="page('location')">📍 लाइव लोकेशन</button>
<button onclick="page('subscription')">💳 सदस्यता</button>
</div>
</div>

<div id="jobs" class="card hidden"><h2>🛠️ काम</h2><div id="jobList"></div></div>

<div id="createJob" class="card hidden"><h2>काम डालें</h2>
<select id="jtype"><option>इलेक्ट्रिशियन</option><option>प्लंबर</option></select>
<input id="jtitle" placeholder="काम का नाम"><textarea id="jdesc" placeholder="विवरण"></textarea>
<input id="jprice" placeholder="कीमत ₹"><input id="jphone" placeholder="मोबाइल नंबर">
<button onclick="jobLocation()">📍 लोकेशन लें</button><p id="jl" class="muted"></p>
<button onclick="createJob()">काम पोस्ट करें</button></div>

<div id="posts" class="card hidden"><h2>📸 पोस्ट</h2><textarea id="ptext" placeholder="कुछ लिखें..."></textarea>
<input id="pimage" type="file" accept="image/*"><button onclick="createPost()">पोस्ट करें</button><div id="postList"></div></div>

<div id="profile" class="card hidden"><h2>👤 प्रोफाइल</h2>
<input id="pname" placeholder="नाम"><input id="city" placeholder="शहर"><input id="exp" placeholder="अनुभव">
<button onclick="saveProfile()">सेव</button><p id="profileInfo"></p></div>

<div id="location" class="card hidden"><h2>📍 लोकेशन</h2>
<button onclick="currentLocation()">करंट लोकेशन</button><button onclick="liveLocation()">🔴 लाइव लोकेशन शुरू</button><button onclick="stopLive()">बंद करें</button><p id="loc"></p></div>

<div id="subscription" class="card hidden"><h2>💳 Worker Membership</h2>
<button onclick="subscribe(50)">₹50 / महीना</button><button onclick="subscribe(100)">₹100 / महीना</button><p id="submsg" class="muted"></p></div>

<div id="admin" class="card hidden"><h2>👑 Owner Panel</h2><button onclick="admin()">Dashboard</button><pre id="adminData" style="white-space:pre-wrap"></pre></div>
</div>
</main>

<nav id="nav" class="hidden"><button onclick="page('home')">🏠 Home</button><button onclick="page('jobs')">🛠️ Work</button><button onclick="page('posts')">📸 Post</button><button onclick="page('profile')">👤 Profile</button><button id="adminBtn" class="hidden" onclick="page('admin')">👑 Owner</button></nav>

<script>
const API = localStorage.getItem("bn_api") || "http://localhost:3000/api";
let token=localStorage.getItem("bn_token")||"", me=null, watch=null;

async function api(path,opt={}){opt.headers={...(opt.headers||{}),"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(API+path,opt);let d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function login(){try{let d=await api("/login",{method:"POST",body:JSON.stringify({email:email.value,name:name.value,role:role.value})});token=d.token;me=d.user;localStorage.setItem("bn_token",token);openApp()}catch(e){alert(e.message)}}
function openApp(){loginBox(false);document.getElementById("who").textContent=me.name+" • "+me.role;adminBtn.classList.toggle("hidden",me.role!=="OWNER");page("home");loadJobs();loadPosts();loadProfile()}
function loginBox(hide){document.getElementById("login").classList.toggle("hidden",hide);document.getElementById("app").classList.toggle("hidden",!hide);document.getElementById("nav").classList.toggle("hidden",!hide)}
function page(id){document.querySelectorAll("#app>div").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");if(id==="jobs")loadJobs();if(id==="posts")loadPosts();if(id==="admin")admin()}
async function loadJobs(){let a=await api("/jobs");jobList.innerHTML=a.map(j=>`<div class="card"><b>${j.title}</b><p>${j.type} • ${j.description}</p><b>₹${j.price||"बात करके"}</b><p class="muted">${j.ownerName}</p><button onclick="take('${j.id}')">🛠️ काम लेना है</button><button class="green" onclick="location.href='tel:${j.phone}'">📞 कॉल</button><button class="green" onclick="window.open('https://wa.me/91'+String('${j.phone}').replace(/\\D/g,''),'_blank')">🟢 WhatsApp</button>${j.location?`<a target="_blank" href="https://www.google.com/maps?q=${j.location.lat},${j.location.lng}">📍 रास्ता देखें</a>`:""}</div>`).join("")}
async function take(id){try{await api("/jobs/"+id+"/take",{method:"POST"});alert("काम लेने की रिक्वेस्ट भेजी गई");loadJobs()}catch(e){alert(e.message)}}
function jobLocation(){navigator.geolocation.getCurrentPosition(p=>{window.jloc={lat:p.coords.latitude,lng:p.coords.longitude};jl.textContent=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`},()=>alert("लोकेशन अनुमति दें"))}
async function createJob(){try{await api("/jobs",{method:"POST",body:JSON.stringify({type:jtype.value,title:jtitle.value,description:jdesc.value,price:jprice.value,phone:jphone.value,location:window.jloc||null})});alert("काम पोस्ट हो गया");page("jobs");loadJobs()}catch(e){alert(e.message)}}
function fileData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function createPost(){try{let img=pimage.files[0]?await fileData(pimage.files[0]):"";await api("/posts",{method:"POST",body:JSON.stringify({text:ptext.value,image:img})});ptext.value="";pimage.value="";loadPosts()}catch(e){alert(e.message)}}
async function loadPosts(){let a=await api("/posts");postList.innerHTML=a.map(p=>`<div class="card"><b>${p.userName}</b><p>${p.text}</p>${p.image?`<img src="${p.image}">`:""}</div>`).join("")}
async function loadProfile(){let u=await api("/me");me=u;pname.value=u.name||"";city.value=u.city||"";exp.value=u.experience||"";profileInfo.textContent=`${u.email} • ${u.role}`}
async function saveProfile(){await api("/profile",{method:"PUT",body:JSON.stringify({name:pname.value,city:city.value,experience:exp.value})});alert("सेव हो गया");loadProfile();who.textContent=pname.value+" • "+me.role}
function currentLocation(){navigator.geolocation.getCurrentPosition(p=>{loc.textContent=`📍 ${p.coords.latitude}, ${p.coords.longitude}`;window.lastLoc={lat:p.coords.latitude,lng:p.coords.longitude}},()=>alert("लोकेशन अनुमति दें"))}
function liveLocation(){if(watch)return;watch=navigator.geolocation.watchPosition(p=>{loc.textContent=`🔴 LIVE: ${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`},()=>alert("लाइव लोकेशन अनुमति दें"))}
function stopLive(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;loc.textContent="लाइव लोकेशन बंद है"}
async function subscribe(plan){try{let d=await api("/subscriptions",{method:"POST",body:JSON.stringify({plan})});submsg.textContent=d.message}catch(e){alert(e.message)}}
async function admin(){try{let d=await api("/admin/dashboard");adminData.textContent=JSON.stringify({owner:d.owner,users:d.users,jobs:d.jobs,posts:d.posts,subscriptions:d.subscriptions},null,2)}catch(e){adminData.textContent=e.message}}
if(token){api("/me").then(u=>{me=u;openApp()}).catch(()=>{token="";localStorage.removeItem("bn_token")})}
</script>
</body>
</html>
